name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        lancedb: ["0.3.1", "0.3.4", "0.5", "0.16.0", "0.24.3", "0.29.2", "0.33.0"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Read app version
      id: version
      run: echo "app_version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch,suffix=-lancedb-${{ matrix.lancedb }}
          type=ref,event=pr,suffix=-lancedb-${{ matrix.lancedb }}
          type=semver,pattern=app-{{version}}_lancedb-${{ matrix.lancedb }}
          type=semver,pattern=v{{version}},enable=${{ matrix.lancedb == '0.33.0' && startsWith(github.ref, 'refs/tags/') }}
          type=raw,value=lancedb-${{ matrix.lancedb }}
          type=raw,value=latest,enable=${{ matrix.lancedb == '0.33.0' && github.ref == 'refs/heads/main' }}
          type=raw,value=stable,enable=${{ matrix.lancedb == '0.33.0' && startsWith(github.ref, 'refs/tags/') }}

    # Build the amd64 image and run it before anything is published. The test
    # job only exercises the source tree, so this is the first thing that
    # proves the image itself works. load: true accepts one platform only, so
    # the multi-platform build below reuses these layers from the cache.
    - name: Build image for the smoke test
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./docker/Dockerfile
        load: true
        platforms: linux/amd64
        tags: smoke:${{ matrix.lancedb }}
        cache-from: type=gha,scope=lancedb-${{ matrix.lancedb }}
        build-args: |
          LANCEDB_VERSION=${{ matrix.lancedb }}
          APP_VERSION=${{ steps.version.outputs.app_version }}

    - name: Smoke test the image
      run: |
        set -euo pipefail

        cleanup() {
          status=$?
          if [ $status -ne 0 ]; then
            echo "--- container logs ---"
            docker logs smoke 2>&1 || true
          fi
          docker rm -f smoke >/dev/null 2>&1 || true
          exit $status
        }
        trap cleanup EXIT

        # entrypoint.sh only needs DATA_PATH to exist and to be readable.
        # Docker picks the host port, so the runner needs no free port of ours.
        mkdir -p /tmp/smoke-data
        docker run -d --name smoke -p 127.0.0.1::8080 \
          -v /tmp/smoke-data:/data:ro \
          smoke:${{ matrix.lancedb }}

        url="http://$(docker port smoke 8080 | head -1)"
        echo "container is on ${url}"

        for _ in $(seq 30); do
          if curl -fsS "${url}/healthz" >/dev/null 2>&1; then
            break
          fi
          sleep 1
        done

        echo "--- /healthz ---"
        curl -fsS "${url}/healthz" | tee /tmp/healthz.json
        echo
        grep -q '"ok":true' /tmp/healthz.json

        echo "--- /datasets ---"
        curl -fsS "${url}/datasets" | grep -q '"datasets"'

        # The static files live at /web in the image. app.py mounts them only
        # when that directory exists, so a wrong COPY path serves no frontend
        # while every API endpoint still answers.
        echo "--- static files ---"
        curl -fsS -o /dev/null "${url}/"
        curl -fsS -o /dev/null "${url}/app.js"

        echo "smoke test passed for lancedb ${{ matrix.lancedb }}"

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./docker/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha,scope=lancedb-${{ matrix.lancedb }}
        cache-to: type=gha,mode=max,scope=lancedb-${{ matrix.lancedb }}
        build-args: |
          LANCEDB_VERSION=${{ matrix.lancedb }}
          APP_VERSION=${{ steps.version.outputs.app_version }}

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lancedb: ["0.3.1", "0.3.4", "0.5", "0.16.0", "0.24.3", "0.29.2", "0.33.0"]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -c backend/constraints-${{ matrix.lancedb }}.txt \
          -r backend/requirements.txt
        # httpx is required by TestClient; <0.28 keeps the app= kwarg
        # that the starlette version pinned by fastapi 0.104 still uses
        pip install pytest "httpx<0.28"

    - name: Run API endpoint tests
      run: |
        cd backend
        python -m pytest tests/ -v
